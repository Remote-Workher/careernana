<!doctype html>
<html><head><meta charset="utf-8"/><link rel="stylesheet" href="panel.css"/></head>
<body>
  <header>
    <img src="icon.png" width="24" height="24" alt=""/>
    <strong>Tailor with AI</strong>
    <button id="rw-close" aria-label="Close">×</button>
  </header>
  <main>
    <div id="rw-ctx" class="ctx"></div>
    <button id="rw-go" class="primary">✨ Generate (5 coins)</button>
    <button id="rw-log" class="secondary">📌 I applied — log this job</button>
    <div id="rw-out" hidden>
      <h3>Resume</h3><textarea id="rw-resume" rows="10"></textarea>
      <button class="copy" data-target="rw-resume">Copy resume</button>
      <h3>Cover letter</h3><textarea id="rw-cover" rows="8"></textarea>
      <button class="copy" data-target="rw-cover">Copy cover letter</button>
      <h3>Talking points</h3><ul id="rw-talk"></ul>
    </div>
    <p id="rw-msg" class="msg"></p>
  </main>
  <script src="panel.js"></script>
</body></html>
